services:
  huawei-lte-exporter:
    image: ghcr.io/imbo-fr/huawei-lte-exporter:latest@sha256:f7f9753933c443a77aee5a5c7ef60ca6f2aebb70db6f933f8864f63d766d4465
    # build: .   # ← uncomment for local dev
    container_name: huawei-lte-exporter
    environment:
      ROUTER_URL:     "http://192.168.8.1/"
      ROUTER_USER:    "admin"
      ROUTER_PASS:    "${ROUTER_PASS}"
      EXPORTER_PORT:  "9898"
      LOG_LEVEL:      "INFO"
      SCRAPE_TIMEOUT: "10"
    restart: unless-stopped
    ports:
      - "9898:9898"