services:
  huawei-lte-exporter:
    image: ghcr.io/imbo-fr/huawei-lte-exporter:latest@sha256:c5d199c3f8b5d29fd430a03da8e9fd1be07b532985f6a6a79ea8541027a713d5
    # build: .   # ← uncomment for local dev
    container_name: huawei-lte-exporter
    environment:
      ROUTER_URL:     "http://192.168.8.1/"
      ROUTER_USER:    "admin"
      ROUTER_PASS:    "${ROUTER_PASS}"
      EXPORTER_PORT:  "9898"
      LOG_LEVEL:      "INFO"
      SCRAPE_TIMEOUT: "10"
    restart: unless-stopped
    ports:
      - "9898:9898"