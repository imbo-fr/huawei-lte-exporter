services:
  huawei-lte-exporter:
    image: ghcr.io/imbo-fr/huawei-lte-exporter:latest@sha256:7426594b80b87f535d8a04f4477614d4c513ddb8dd3aae820f1dfe89ff5707e1
    # build: .   # ← uncomment for local dev
    container_name: huawei-lte-exporter
    environment:
      ROUTER_URL:     "http://192.168.8.1/"
      ROUTER_USER:    "admin"
      ROUTER_PASS:    "${ROUTER_PASS}"
      EXPORTER_PORT:  "9898"
      LOG_LEVEL:      "INFO"
      SCRAPE_TIMEOUT: "10"
    restart: unless-stopped
    ports:
      - "9898:9898"